<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — Mahi Tech Group</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(59, 130, 246, 0.14), transparent 60%),
        radial-gradient(900px 500px at 110% 110%, rgba(139, 92, 246, 0.10), transparent 55%),
        var(--bg-main, #080b11);
      font-family: 'Segoe UI', 'Inter', system-ui, sans-serif; color: #e2e8f0; padding: 1.5rem;
    }
    .shell { width: 100%; max-width: 420px; }
    .brand-row { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 28px; }
    .brand-mark {
      width: 46px; height: 46px; border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.05rem; color: #fff;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
    }
    .brand-name { font-size: 1.15rem; font-weight: 700; }
    .card {
      background: var(--bg-card, #151c2f); border: 1px solid var(--border-subtle, #1e2840);
      border-radius: 16px; padding: 32px 28px; box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    }
    .card h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 4px; }
    .card .sub { font-size: 0.85rem; color: #7c8db5; margin-bottom: 24px; line-height: 1.5; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.78rem; font-weight: 600; color: #aab6d3; margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 11px 14px; border-radius: 10px;
      border: 1px solid var(--border-strong, #2a3754); background: var(--bg-surface, #0f1422);
      color: #e2e8f0; font-size: 0.92rem; outline: none;
    }
    .field input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.18); }
    .msg { display: none; border-radius: 10px; padding: 10px 14px; font-size: 0.82rem; line-height: 1.5; margin-bottom: 16px; }
    .msg.error { background: rgba(239,68,68,0.10); border: 1px solid rgba(239,68,68,0.35); color: #fca5a5; }
    .msg.success { background: rgba(16,185,129,0.10); border: 1px solid rgba(16,185,129,0.35); color: #6ee7b7; }
    .msg.visible { display: block; }
    .btn {
      width: 100%; padding: 12px 16px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #6366f1); color: #fff;
      font-size: 0.95rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 10px 26px rgba(59,130,246,0.35);
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .foot { margin-top: 18px; text-align: center; font-size: 0.82rem; }
    .foot a { color: #7c8db5; text-decoration: none; }
    .foot a:hover { color: #93c5fd; }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand-row">
      <div class="brand-mark">MTG</div>
      <div class="brand-name">Mahi Tech Group</div>
    </div>

    <section class="card">
      <h1>Set a new password</h1>
      <p class="sub">Choose a strong new password for your account.</p>

      <div class="msg" id="msgBox" role="status"></div>

      <form id="resetForm" novalidate>
        <div class="field">
          <label for="password">New Password</label>
          <input type="password" id="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required autofocus>
        </div>
        <div class="field">
          <label for="password2">Confirm New Password</label>
          <input type="password" id="password2" placeholder="Repeat the new password" minlength="8" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn" id="submitBtn">Set new password</button>
      </form>

      <div class="foot"><a href="/login.html">← Back to sign in</a></div>
    </section>
  </main>

  <script>
    (function () {
      'use strict';
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const form = document.getElementById('resetForm');
      const msg = document.getElementById('msgBox');
      const btn = document.getElementById('submitBtn');

      function show(text, cls) {
        msg.textContent = text;
        msg.className = 'msg visible ' + cls;
      }

      if (!token) {
        show('This page needs a reset link from your email. Request a new one from the Forgot Password page.', 'error');
        form.style.display = 'none';
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const password2 = document.getElementById('password2').value;
        if (password.length < 8) { show('Password must be at least 8 characters.', 'error'); return; }
        if (password !== password2) { show('Passwords do not match.', 'error'); return; }

        btn.disabled = true;
        btn.textContent = 'Updating...';
        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password })
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok) {
            show('Password updated! All old sessions were signed out. Redirecting to sign in...', 'success');
            setTimeout(() => window.location.replace('/login.html'), 2200);
          } else {
            show(data.error || 'Reset failed. The link may have expired — request a new one.', 'error');
            btn.disabled = false;
            btn.textContent = 'Set new password';
          }
        } catch (err) {
          show('Cannot reach the server. Try again.', 'error');
          btn.disabled = false;
          btn.textContent = 'Set new password';
        }
      });
    })();
  </script>
</body>
</html>
