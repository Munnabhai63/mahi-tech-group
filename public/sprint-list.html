<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprint List — Mahi Tech Group</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-surface: #0f172a;
      --bg-card: #1e293b;
      --border-card: #334155;
      --border-light: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-nav {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-card);
      padding: 0.85rem 1.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      color: #38bdf8;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .nav-breadcrumbs {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-nav {
      background: #1e293b;
      border: 1px solid var(--border-card);
      color: #e2e8f0;
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-nav:hover {
      background: #334155;
      color: #ffffff;
      border-color: #475569;
    }

    .btn-create-sprint {
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      border: 1px solid #7dd3fc;
      color: #0f172a;
      padding: 0.5rem 1.1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
    }

    .btn-create-sprint:hover {
      background: linear-gradient(135deg, #0369a1 0%, #0284c7 100%);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #1e293b;
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      border: 1px solid var(--border-card);
    }

    .role-badge {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    /* Container */
    .sprint-list-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      padding: 1.5rem 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .header-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .header-banner h2 {
      margin: 0;
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
    }

    /* Sprint Cards Grid */
    .sprint-cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    .sprint-row-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-card);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .sprint-row-card:hover {
      border-color: #475569;
      background: #1e293b;
      transform: translateY(-2px);
      box-shadow: 0 8px 16px -2px rgba(0, 0, 0, 0.3);
    }

    .sprint-main-info {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-width: 280px;
      flex: 1;
    }

    .sprint-name-line {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .sprint-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: #f8fafc;
      margin: 0;
    }

    .status-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-ACTIVE { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }
    .status-DRAFT { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.4); }
    .status-COMPLETED { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .status-CANCELLED { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }

    .sprint-goal {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: 0;
    }

    .sprint-meta-chips {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .meta-chip {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .meta-chip-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .meta-chip-val {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .sprint-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .btn-start-sprint {
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      border: none;
      color: #0f172a;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-start-sprint:hover {
      background: linear-gradient(135deg, #0369a1 0%, #0284c7 100%);
      color: #ffffff;
    }

    .btn-delete-sprint {
      background: transparent;
      border: 1px solid var(--border-card);
      color: #f87171;
      font-size: 0.8rem;
      padding: 0.45rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-delete-sprint:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
    }

    /* Modal Form */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      padding: 1.75rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.35rem;
    }

    .form-input {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border-card);
      color: #f8fafc;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    .form-input:focus {
      border-color: #38bdf8;
    }

    /* Toast */
    .toast-box {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      border: 1px solid var(--border-card);
      padding: 0.85rem 1.25rem;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 0.85rem;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
      z-index: 200;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 1.5rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="top-nav" id="sprintListNav">
    <div class="brand-wrap">
      <a href="/sprint-list.html" class="brand-title" id="navLogoLink">
        <span>⚡</span> MAHI TECH GROUP
      </a>
      <span style="color: var(--border-card);">/</span>
      <div class="nav-breadcrumbs">
        <span id="projectBreadcrumb">Project</span>
        <span style="color: var(--border-card);">/</span>
        <strong>All Sprints</strong>
      </div>
    </div>

    <div class="nav-actions">
      <a href="/backlog.html" class="btn-nav" id="linkBacklog">📋 Backlog</a>
      <a href="/velocity-chart.html" class="btn-nav" id="linkVelocityChart">📊 Velocity & Burndown</a>
      
      <button class="btn-create-sprint" id="btnOpenCreateSprint" style="display:none;">
        ＋ Create Sprint
      </button>

      <div class="user-pill" id="userPill">
        <span id="userRoleBadge" class="role-badge">USER</span>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="sprint-list-wrapper">
    
    <div class="header-banner">
      <div>
        <h2>Sprints & Cycles</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0.25rem 0 0 0;">
          All planned, active, and completed delivery cycles for this project.
        </p>
      </div>
    </div>

    <!-- Sprints Container -->
    <section class="sprint-cards-grid" id="sprintCardsContainer">
      <div class="empty-state">Loading sprints...</div>
    </section>

  </main>

  <!-- Create Sprint Modal -->
  <div class="modal-backdrop" id="createSprintModal">
    <div class="modal-card">
      <h3 style="margin-top:0; color: #38bdf8; font-family: 'Outfit', sans-serif;">Create New Sprint</h3>
      <form id="createSprintForm">
        <div class="form-group">
          <label>Sprint Name *</label>
          <input type="text" id="sprintNameInput" class="form-input" required placeholder="e.g. Sprint 1 - Core MVP">
        </div>

        <div class="form-group">
          <label>Sprint Goal</label>
          <input type="text" id="sprintGoalInput" class="form-input" placeholder="e.g. Deliver authentication and onboarding flow">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
          <div class="form-group">
            <label>Start Date</label>
            <input type="date" id="sprintStartInput" class="form-input">
          </div>
          <div class="form-group">
            <label>End Date</label>
            <input type="date" id="sprintEndInput" class="form-input">
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
          <button type="button" class="btn-nav" id="btnCancelCreate">Cancel</button>
          <button type="submit" class="btn-create-sprint" id="btnSubmitCreate">Create Sprint</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-box" id="toastBox">
    <span id="toastMsg">Action completed</span>
  </div>

  <script>
    (function () {
      'use strict';

      const urlParams = new URLSearchParams(window.location.search);
      let projectId = urlParams.get('projectId') || urlParams.get('id');

      const authToken = localStorage.getItem('mtg_auth_token') || localStorage.getItem('token') || '';
      let currentUser = null;

      // Elements
      const sprintCardsContainer = document.getElementById('sprintCardsContainer');
      const projectBreadcrumb = document.getElementById('projectBreadcrumb');
      const userRoleBadge = document.getElementById('userRoleBadge');
      const btnOpenCreateSprint = document.getElementById('btnOpenCreateSprint');
      const createSprintModal = document.getElementById('createSprintModal');
      const btnCancelCreate = document.getElementById('btnCancelCreate');
      const createSprintForm = document.getElementById('createSprintForm');

      const toastBox = document.getElementById('toastBox');
      const toastMsg = document.getElementById('toastMsg');

      function showToast(msg, isError = false) {
        toastMsg.textContent = msg;
        toastBox.style.borderLeft = isError ? '4px solid #ef4444' : '4px solid #10b981';
        toastBox.style.display = 'flex';
        setTimeout(() => { toastBox.style.display = 'none'; }, 3000);
      }

      async function api(path, method = 'GET', body = null) {
        const headers = { 'Content-Type': 'application/json' };
        if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
        const opts = { method, headers };
        if (body && method !== 'GET') opts.body = JSON.stringify(body);
        const res = await fetch(path, opts);
        let data = null;
        try { data = await res.json(); } catch (e) {}
        return { status: res.status, ok: res.ok, data };
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function isAdminOrLead() {
        if (!currentUser) return false;
        const role = (currentUser.role || '').toLowerCase();
        const subRole = (currentUser.sub_role || '').toLowerCase();
        return role === 'admin' || role === 'lead' || subRole === 'lead';
      }

      async function init() {
        const meRes = await api('/api/users/me');
        if (meRes.ok && meRes.data) {
          currentUser = meRes.data;
          userRoleBadge.textContent = currentUser.role || 'member';
          if (isAdminOrLead()) {
            btnOpenCreateSprint.style.display = 'inline-flex';
          }
        }

        if (!projectId) {
          const projsRes = await api('/api/projects');
          if (projsRes.ok && Array.isArray(projsRes.data) && projsRes.data.length > 0) {
            projectId = projsRes.data[0].id;
          } else {
            sprintCardsContainer.innerHTML = '<div class="empty-state">No project specified. Provide ?projectId= in URL.</div>';
            return;
          }
        }

        projectBreadcrumb.textContent = `Project #${projectId}`;
        document.getElementById('linkBacklog').href = `/backlog.html?projectId=${projectId}`;
        document.getElementById('linkVelocityChart').href = `/velocity-chart.html?projectId=${projectId}`;

        btnOpenCreateSprint.addEventListener('click', () => {
          createSprintModal.style.display = 'flex';
        });
        btnCancelCreate.addEventListener('click', () => {
          createSprintModal.style.display = 'none';
        });
        createSprintForm.addEventListener('submit', handleCreateSprint);

        await loadSprints();
      }

      async function loadSprints() {
        const res = await api(`/api/sprint/project/${projectId}`);
        if (!res.ok) {
          showToast(res.data?.error || 'Failed to load sprints', true);
          sprintCardsContainer.innerHTML = '<div class="empty-state">Error loading sprints.</div>';
          return;
        }

        const sprints = res.data || [];
        renderSprints(sprints);
      }

      function renderSprints(sprints) {
        sprintCardsContainer.innerHTML = '';

        if (sprints.length === 0) {
          sprintCardsContainer.innerHTML = `
            <div class="empty-state">
              No sprints created yet. Click "+ Create Sprint" to start planning.
            </div>
          `;
          return;
        }

        const canAdmin = isAdminOrLead();

        sprints.forEach(s => {
          const card = document.createElement('div');
          card.className = 'sprint-row-card';
          card.id = `sprint-row-${s.id}`;

          const status = escapeHtml(s.status || 'DRAFT');
          const name = escapeHtml(s.name);
          const goal = s.goal ? escapeHtml(s.goal) : 'No goal set';
          const sDate = s.start_date || 'TBD';
          const eDate = s.end_date || 'TBD';
          const committed = Number(s.committed_points) || 0;
          const completed = Number(s.completed_points) || 0;
          const rate = Number(s.completion_rate) || 0;

          // Actions
          let actionsHtml = '';
          if (canAdmin && s.status === 'DRAFT') {
            actionsHtml += `<button class="btn-start-sprint" data-sprint-id="${s.id}">▶ Start Sprint</button>`;
            actionsHtml += `<button class="btn-delete-sprint" data-sprint-id="${s.id}" title="Delete Draft Sprint">🗑️</button>`;
          }

          card.innerHTML = `
            <div class="sprint-main-info">
              <div class="sprint-name-line">
                <h3 class="sprint-name">${name}</h3>
                <span class="status-badge status-${status}">${status}</span>
              </div>
              <p class="sprint-goal">${goal}</p>
            </div>

            <div class="sprint-meta-chips">
              <div class="meta-chip">
                <span class="meta-chip-label">Dates</span>
                <span class="meta-chip-val" style="font-size: 0.85rem;">${sDate} → ${eDate}</span>
              </div>
              <div class="meta-chip">
                <span class="meta-chip-label">Committed</span>
                <span class="meta-chip-val">${committed} pts</span>
              </div>
              <div class="meta-chip">
                <span class="meta-chip-label">Completed</span>
                <span class="meta-chip-val" style="color: #34d399;">${completed} pts</span>
              </div>
              <div class="meta-chip">
                <span class="meta-chip-label">Completion %</span>
                <span class="meta-chip-val">${rate}%</span>
              </div>
            </div>

            <div class="sprint-actions">
              ${actionsHtml}
              <button class="btn-nav btn-view-board" data-sprint-id="${s.id}">View Board →</button>
            </div>
          `;

          // Card click goes to board
          card.addEventListener('click', (e) => {
            if (e.target.closest('button')) return; // ignore button clicks
            window.location.href = `/sprint-board.html?sprintId=${s.id}&projectId=${projectId}`;
          });

          // View Board button click
          const btnView = card.querySelector('.btn-view-board');
          btnView.addEventListener('click', (e) => {
            e.stopPropagation();
            window.location.href = `/sprint-board.html?sprintId=${s.id}&projectId=${projectId}`;
          });

          // Start Sprint button click
          const btnStart = card.querySelector('.btn-start-sprint');
          if (btnStart) {
            btnStart.addEventListener('click', async (e) => {
              e.stopPropagation();
              const res = await api(`/api/sprint/${s.id}/start`, 'PATCH');
              if (!res.ok) {
                showToast(res.data?.error || 'Failed to start sprint', true);
              } else {
                showToast(`Sprint "${s.name}" is now ACTIVE!`);
                await loadSprints();
              }
            });
          }

          // Delete Sprint button click
          const btnDel = card.querySelector('.btn-delete-sprint');
          if (btnDel) {
            btnDel.addEventListener('click', async (e) => {
              e.stopPropagation();
              if (!confirm(`Are you sure you want to delete draft sprint "${s.name}"?`)) return;
              const res = await api(`/api/sprint/${s.id}`, 'DELETE');
              if (!res.ok) {
                showToast(res.data?.error || 'Cannot delete sprint', true);
              } else {
                showToast('Sprint deleted successfully');
                await loadSprints();
              }
            });
          }

          sprintCardsContainer.appendChild(card);
        });
      }

      async function handleCreateSprint(e) {
        e.preventDefault();
        const name = document.getElementById('sprintNameInput').value.trim();
        const goal = document.getElementById('sprintGoalInput').value.trim();
        const start_date = document.getElementById('sprintStartInput').value;
        const end_date = document.getElementById('sprintEndInput').value;

        if (!name) {
          showToast('Sprint name is required', true);
          return;
        }

        const res = await api('/api/sprint/create', 'POST', {
          project_id: projectId,
          name,
          goal,
          start_date: start_date || null,
          end_date: end_date || null
        });

        if (!res.ok) {
          showToast(res.data?.error || 'Failed to create sprint', true);
        } else {
          showToast('Sprint created in DRAFT status!');
          createSprintForm.reset();
          createSprintModal.style.display = 'none';
          await loadSprints();
        }
      }

      init();
    })();
  </script>
</body>
</html>
