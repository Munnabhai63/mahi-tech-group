<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Mahi Tech Group</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(59, 130, 246, 0.14), transparent 60%),
        radial-gradient(900px 500px at 110% 110%, rgba(139, 92, 246, 0.10), transparent 55%),
        var(--bg-main, #080b11);
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      color: #e2e8f0;
      padding: 1.5rem;
    }

    .login-shell { width: 100%; max-width: 420px; }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
      margin-bottom: 28px;
    }

    .brand-mark {
      width: 46px; height: 46px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.05rem; color: #fff;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
    }

    .brand-name { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.02em; }
    .brand-name small { display: block; font-size: 0.68rem; font-weight: 500; color: #7c8db5; letter-spacing: 0.14em; text-transform: uppercase; margin-top: 2px; }

    .login-card {
      background: var(--bg-card, #151c2f);
      border: 1px solid var(--border-subtle, #1e2840);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    .login-card h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 4px; }
    .login-card .sub { font-size: 0.85rem; color: #7c8db5; margin-bottom: 24px; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.78rem; font-weight: 600; color: #aab6d3; margin-bottom: 6px; letter-spacing: 0.03em; }

    .field input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-strong, #2a3754);
      background: var(--bg-surface, #0f1422);
      color: #e2e8f0;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .field input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18); }
    .field input::placeholder { color: #4a5878; }

    .form-error {
      display: none;
      background: rgba(239, 68, 68, 0.10);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.82rem;
      line-height: 1.45;
      margin-bottom: 16px;
    }
    .form-error.visible { display: block; }

    .form-info {
      display: none;
      background: rgba(245, 158, 11, 0.10);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fcd34d;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.82rem;
      line-height: 1.45;
      margin-bottom: 16px;
    }
    .form-info.visible { display: block; }

    .submit-btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 0 10px 26px rgba(59, 130, 246, 0.35);
    }
    .submit-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 14px 32px rgba(59, 130, 246, 0.45); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .foot-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 22px;
      font-size: 0.82rem;
    }
    .foot-links a { color: #7c8db5; text-decoration: none; transition: color 0.12s ease; }
    .foot-links a:hover { color: #93c5fd; }

    .demo-note {
      margin-top: 18px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px dashed var(--border-strong, #2a3754);
      font-size: 0.74rem;
      color: #5d6f97;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 480px) {
      .login-card { padding: 26px 20px; }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <div class="brand-row">
      <div class="brand-mark">MTG</div>
      <div class="brand-name">
        Mahi Tech Group
        <small>Team Orchestration Platform</small>
      </div>
    </div>

    <section class="login-card">
      <h1>Sign In</h1>
      <p class="sub">Access your workspace dashboard, voting feed and projects.</p>

      <div class="form-info" id="infoBox" role="status"></div>
      <div class="form-error" id="errorBox" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" name="email" placeholder="you@mahitechgroup.com" autocomplete="email" required autofocus>
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" name="password" placeholder="Enter your password" autocomplete="current-password" minlength="8" required>
        </div>

        <button type="submit" class="submit-btn" id="loginSubmitBtn">Sign In</button>
      </form>

      <div class="foot-links">
        <a href="/signup.html">New here? Apply for membership →</a>
        <a href="/forgot-password.html">Forgot password?</a>
      </div>

      <div class="demo-note">
        Access is granted by the Administrator after membership approval.
        Demo accounts are available in development builds only.
      </div>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      // Already signed in? Straight to the dashboard.
      if (localStorage.getItem('token') && localStorage.getItem('user')) {
        window.location.replace('/');
        return;
      }

      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('loginEmail');
      const passwordInput = document.getElementById('loginPassword');
      const submitBtn = document.getElementById('loginSubmitBtn');
      const errorBox = document.getElementById('errorBox');
      const infoBox = document.getElementById('infoBox');

      function showError(msg) {
        infoBox.classList.remove('visible');
        errorBox.textContent = msg;
        errorBox.classList.add('visible');
      }

      function showInfo(msg) {
        errorBox.classList.remove('visible');
        infoBox.textContent = msg;
        infoBox.classList.add('visible');
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, (c) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showError('Please enter both your email address and password.');
          return;
        }
        if (password.length < 8) {
          showError('Password must be at least 8 characters long.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';
        errorBox.classList.remove('visible');
        infoBox.classList.remove('visible');

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });

          const data = await res.json().catch(() => ({}));

          if (res.ok && data.token && data.user) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            submitBtn.textContent = 'Success! Redirecting...';
            window.location.replace('/');
            return;
          }

          // Lifecycle-specific messaging from the API
          if (res.status === 403 && data.error === 'Account Pending Approval') {
            showInfo('Your membership application is still under review by the Administrator. Please check back later.');
          } else if (res.status === 403 && data.error === 'Application Denied') {
            showInfo('Your membership application was not approved. Please contact the Administrator.');
          } else if (res.status === 403 && data.error === 'Access Revoked') {
            showInfo('Your access has been revoked. Please contact the Administrator.');
          } else if (res.status === 429) {
            showError('Too many sign-in attempts. Please wait a minute and try again.');
          } else {
            showError(escapeHtml(data.error || data.message || 'Invalid email or password.'));
          }
        } catch (err) {
          showError('Cannot reach the server. Please check your connection and try again.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      });
    })();
  </script>
</body>
</html>
