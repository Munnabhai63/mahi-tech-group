name: Continuous Integration & Verification

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Run Core & Regression Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Initialize Test Schema & Seeds
        run: |
          npm run migrate
          npm run seed

      - name: Run Core Test Suite
        run: npm test

      - name: Run PRD 15 Pipeline Verification Suite
        run: node scripts/verify-prd15-layer6.js

      - name: Run PRD 16 Point-Pool & Participation Suite
        run: node scripts/verify-prd16-layer6-integration.js

      - name: Run PRD 17 GitHub Automation Suite
        run: node scripts/verify-prd17-batch5-integration.js
