name: Continuous Integration & Verification

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Full Test Battery (All Suites)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Initialize Test Schema & Seeds
        run: |
          npm run migrate
          npm run seed

      - name: Run Full Test Battery
        run: npm run test:all
